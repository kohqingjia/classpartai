[project]
name = "classpartai"
version = "0.1.0"
description = "ClassPart AI: IS469 Gen AI with LLMs group project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentmail>=0.1",
    "av==16.0.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.0",  # audio-service/requirements.txt pins 2.4.6 in the Docker image
    "openai>=3.42.0",
    "pydantic>=2.8",
    "pypdf>=6.21.4",
    "python-dotenv>=1.0",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "speechbrain>=1.1.2",
    "streamlit>=1.40",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classpartai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
