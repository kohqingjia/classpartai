<!doctype html><html><head><meta charset="utf-8"><style>
:root { --bg:#191919; --ink:#e3e3e3; --muted:#9b9b9b; --line:#2f2f2f; --card:#202020;
        --blue:#2383e2; --green:#4dab6f; --amber:#d9a443;
        --ease-out:cubic-bezier(0.23,1,0.32,1); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
#app { position:relative; height:__HEIGHT__px; display:flex; border:1px solid var(--line);
       border-radius:12px; overflow:hidden; background:radial-gradient(ellipse at center,
       #1f2430 0%, #191919 70%); }
#stage { position:relative; flex:1 1 auto; min-width:0; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#hud { position:absolute; left:14px; top:12px; right:14px; pointer-events:none; }
#status { font-size:12px; color:var(--muted); letter-spacing:.02em; }
#status b { color:var(--ink); }
#query { margin-top:6px; font-size:14px; color:#cfe3ff; min-height:20px; font-weight:600;
         text-shadow:0 0 12px rgba(35,131,226,.6); }
#controls { position:absolute; left:12px; bottom:10px; display:flex; gap:6px; align-items:center; }
#controls button { background:#262626; color:var(--ink); border:1px solid var(--line);
       border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer;
       transition:transform 160ms var(--ease-out), border-color 150ms ease; }
#controls button:active { transform:scale(0.97); }
@media (hover:hover) and (pointer:fine) { #controls button:hover { border-color:var(--blue); } }
#step { font-size:12px; color:var(--muted); margin-left:4px; font-variant-numeric:tabular-nums; }
#panel { flex:0 0 300px; border-left:1px solid var(--line); background:rgba(32,32,32,.92);
         display:flex; flex-direction:column; min-height:0; }
#panel h4 { margin:0; padding:12px 14px 8px; font-size:12px; letter-spacing:.06em;
            text-transform:uppercase; color:var(--muted); font-weight:600; }
#list { overflow-y:auto; padding:0 10px 10px; flex:1 1 auto; }
.item { background:#252525; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
        margin-bottom:8px; font-size:12px; line-height:1.4;
        animation:in 250ms var(--ease-out) backwards; }
.item .src { color:var(--muted); font-size:11px; margin-bottom:3px; display:flex;
             justify-content:space-between; gap:6px; }
.item .score { color:#8fc3ff; font-variant-numeric:tabular-nums; }
.item.cited { border-color:var(--green); }
.item.cited .src { color:var(--green); }
.item.file .src { color:var(--ink); font-weight:600; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
@keyframes in { from { opacity:0; transform:translateY(6px); } }
#tip { position:absolute; pointer-events:none; max-width:280px; background:#111;
       border:1px solid #3a3a3a; border-radius:8px; padding:8px 10px; font-size:12px;
       line-height:1.4; z-index:5; box-shadow:0 6px 20px rgba(0,0,0,.5);
       opacity:0; transform:scale(0.97); transform-origin:top left;
       transition:opacity 125ms ease-out, transform 125ms var(--ease-out); }
#tip.show { opacity:1; transform:none; }
#tip .src { color:var(--muted); font-size:11px; margin-bottom:3px; }
@media (max-width:700px) { #app { flex-direction:column; height:auto; }
  #stage { height:__STAGE_MOBILE__px; flex:none; } #panel { flex:none; max-height:220px;
  border-left:none; border-top:1px solid var(--line); } }
@media (prefers-reduced-motion:reduce) { .item { animation:fade 150ms ease; }
  #tip { transform:none; } #controls button:active { transform:none; } }
@keyframes fade { from { opacity:0; } }
</style></head><body>
<div id="app"><div id="stage"><canvas id="c"></canvas>
<div id="hud"><div id="status"></div><div id="query"></div></div>
<div id="controls"><button id="play">⏸ Pause</button><button id="replay">⟲ Replay</button>
<span id="step"></span></div><div id="tip"></div></div>
<div id="panel"><h4 id="ph">Retrieved</h4><div id="list"></div></div></div>
<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("data").textContent);
const PAL = ["#5aa9ff","#c792ea","#ffcb6b","#82e0aa","#ff8a80","#7fdbff","#f78fb3","#a0e7e5",
             "#b8e986","#ffb86c"];
const QUERY = 900, BEAM = 1100, HOLD = 900, EXAM = 1400, CITE_STEP = 450;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const stars = [], byPid = new Map(), dust = [];
let W = 0, H = 0, cx = 0, cy = 0;
D.docs.forEach((d, i) => {
  d.color = PAL[i % PAL.length];
  d.passages.forEach((p, j) => {
    const s = {doc: d, p, j, x: 0, y: 0, tw: Math.random() * 6.28};
    stars.push(s); byPid.set(p.pid, s);
  });
});
for (let i = 0; i < 140; i++) dust.push({x: Math.random(), y: Math.random(),
  r: Math.random() * 1.1 + .2, tw: Math.random() * 6.28});
const total = stars.length;

// Searches, with only the passages that exist in this vault; ranked best first.
const searches = D.searches.map(s => ({query: s.query,
  hits: s.hits.filter(h => byPid.has(h.passageId))}));
const examined = D.examined.filter(p => byPid.has(p));
const cited = D.cited.filter(c => byPid.has(c.passageId));
const PER = QUERY + BEAM + HOLD;
const searchEnd = searches.length * PER;
const examEnd = searchEnd + (D.finished && examined.length ? EXAM : 0);
const end = examEnd + (D.finished ? cited.length * CITE_STEP + 600 : 0);

function layout() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2 + 8;
  const n = D.docs.length;
  const ax = W * 0.36, ay = H * 0.33;
  D.docs.forEach((d, i) => {
    const m = d.passages.length;
    let ox, oy, r0, R;
    if (n === 1) {
      ox = cx; oy = cy; r0 = 58; R = Math.max(90, Math.min(W, H) * 0.44);
    } else {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      ox = cx + ax * Math.cos(a); oy = cy + ay * Math.sin(a);
      r0 = 0;
      R = Math.max(30, Math.min(95, Math.min(ax, ay) * Math.sin(Math.PI / n) * 0.85,
                                 8 * Math.sqrt(m) + 12));
    }
    d.ox = ox; d.oy = oy; d.R = R;
    d.passages.forEach((p, j) => {
      const s = byPid.get(p.pid), t = Math.sqrt((j + 0.5) / m);
      const th = j * 2.39996 + i * 1.3;
      s.x = ox + (r0 + (R - r0) * t) * Math.cos(th);
      s.y = oy + (r0 + (R - r0) * t) * Math.sin(th) * (n === 1 ? 0.78 : 1);
    });
  });
}

// Everything on screen is a function of the clock t, so replay and live updates are trivial.
let t = D.startAt * PER, playing = true, last = performance.now(), shownSearch = -2, shownCite = -1;

const easeOut = p => 1 - Math.pow(1 - p, 3);

function hitTime(i, rank, count) { return i * PER + QUERY + BEAM * (0.35 + 0.65 * rank / Math.max(1, count)); }

function state(s) {
  let ret = 0, current = false, score = null, flare = 0;
  searches.forEach((q, i) => q.hits.forEach((h, rank) => {
    if (h.passageId !== s.p.pid) return;
    const ht = hitTime(i, rank, q.hits.length);
    if (t >= ht && t < ht + 450) flare = Math.max(flare, 1 - easeOut((t - ht) / 450));
    if (t >= ht) { ret = Math.max(ret, 1); score = h.score;
      if (t < (i + 1) * PER) current = true; }
  }));
  const ex = D.finished && t >= searchEnd && examined.includes(s.p.pid)
    ? Math.min(1, (t - searchEnd) / EXAM) : 0;
  const ci = cited.findIndex(c => c.passageId === s.p.pid);
  const cit = D.finished && ci >= 0 && t >= examEnd + ci * CITE_STEP;
  return {ret, current, ex, cit, score, flare};
}

function drawStar(s, now) {
  const st = state(s), tw = reduce ? 1 : 0.65 + 0.35 * Math.sin(now / 900 + s.tw);
  let r = 2.2, col = s.doc.color, a = 0.5 * tw, glow = 0;
  if (st.ret) { r = 3.4; a = 0.95; glow = st.current ? 16 : 8; col = st.current ? "#ffffff" : s.doc.color; }
  if (st.ex) { r = 3.8; col = "#d9a443"; glow = 12 * st.ex; a = 1; }
  if (st.cit) { r = 4.8; col = "#4dab6f"; glow = 18; a = 1; }
  if (st.flare && !reduce) { r += 4 * st.flare; glow += 14 * st.flare; }
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
  if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.283); ctx.fill(); ctx.restore();
  if (st.cit && !reduce) {
    const ph = ((now / 1200) % 1);
    ctx.save(); ctx.strokeStyle = "#4dab6f"; ctx.globalAlpha = 0.6 * (1 - ph);
    ctx.beginPath(); ctx.arc(s.x, s.y, 5 + ph * 12, 0, 6.283); ctx.stroke(); ctx.restore();
  }
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  dust.forEach(d => { ctx.globalAlpha = 0.15 + 0.15 * Math.sin(now / 1500 + d.tw);
    ctx.fillStyle = "#9fb4d0"; ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r, 0, 6.283); ctx.fill(); });
  ctx.globalAlpha = 1;
  D.docs.forEach(d => {
    const g = ctx.createRadialGradient(d.ox, d.oy, 0, d.ox, d.oy, d.R * 1.25);
    g.addColorStop(0, d.color + "22"); g.addColorStop(1, d.color + "00");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.ox, d.oy, d.R * 1.25, 0, 6.283); ctx.fill();
    ctx.strokeStyle = d.color; ctx.globalAlpha = 0.08; ctx.beginPath();
    d.passages.forEach((p, j) => { const s = byPid.get(p.pid);
      if (j) ctx.lineTo(s.x, s.y); else ctx.moveTo(s.x, s.y); });
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = d.color; ctx.font = "600 11px -apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "center";
    const label = d.title.length > 34 ? d.title.slice(0, 33) + "…" : d.title;
    const ly = D.docs.length === 1 ? Math.min(H - 40, d.oy + d.R * 0.78 + 18) : d.oy + d.R + 16;
    ctx.fillText(label, d.ox, ly);
  });
  // Beams: faint for finished searches, travelling light for the current one.
  searches.forEach((q, i) => {
    const t0 = i * PER + QUERY;
    if (t < t0) return;
    const live = t < (i + 1) * PER;
    q.hits.forEach((h, rank) => {
      const s = byPid.get(h.passageId), ht = hitTime(i, rank, q.hits.length);
      const p = easeOut(Math.min(1, Math.max(0, (t - t0) / (ht - t0))));
      const x = cx + (s.x - cx) * p, y = cy + (s.y - cy) * p;
      const strength = h.score == null ? 0.7 : Math.max(0.35, 1 - rank / (q.hits.length + 1));
      ctx.save();
      ctx.strokeStyle = live ? "#8fc3ff" : s.doc.color;
      ctx.globalAlpha = live ? 0.55 * strength : 0.10;
      ctx.lineWidth = live ? 1.6 * strength + 0.4 : 0.8;
      if (live) { ctx.shadowColor = "#2383e2"; ctx.shadowBlur = 8; }
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
      if (live && p < 1) { ctx.globalAlpha = 1; ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.283); ctx.fill(); }
      ctx.restore();
    });
  });
  stars.forEach(s => drawStar(s, now));
  // The agent at the centre.
  const searching = t < searchEnd || (!D.finished && D.running);
  const pulse = reduce ? 0 : (now / 1400) % 1;
  if (searching) { ctx.save(); ctx.strokeStyle = "#2383e2"; ctx.globalAlpha = 0.5 * (1 - pulse);
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 18 + pulse * 26, 0, 6.283); ctx.stroke();
    ctx.restore(); }
  const g = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 18);
  g.addColorStop(0, "#9fd0ff"); g.addColorStop(1, "#1b5fae");
  ctx.save(); ctx.shadowColor = "#2383e2"; ctx.shadowBlur = 22; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, 6.283); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#e3e3e3"; ctx.font = "600 11px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign = "center"; ctx.fillText(D.agent, cx, cy + 32);
}

function item(cls, src, right, text, color) {
  const el = document.createElement("div"); el.className = "item " + cls;
  const top = document.createElement("div"); top.className = "src";
  const left = document.createElement("span");
  if (color) { const dot = document.createElement("span"); dot.className = "dot";
    dot.style.background = color; left.appendChild(dot); }
  left.appendChild(document.createTextNode(src)); top.appendChild(left);
  if (right) { const r = document.createElement("span"); r.className = "score";
    r.textContent = right; top.appendChild(r); }
  el.appendChild(top);
  if (text) { const b = document.createElement("div"); b.textContent = text; el.appendChild(b); }
  return el;
}

function where(s) { return s.doc.title + (s.p.page ? " · p." + s.p.page : ""); }

function hud() {
  const done = searches.filter((q, i) => t >= (i + 1) * PER - HOLD).length;
  const cur = Math.max(0, Math.min(searches.length - 1, Math.floor(t / PER)));
  const retrieved = new Set();
  searches.forEach((q, i) => q.hits.forEach((h, rank) => {
    if (t >= hitTime(i, rank, q.hits.length)) retrieved.add(h.passageId); }));
  const status = $("status"); status.textContent = "";
  const b = document.createElement("b");
  b.textContent = D.docs.length + " file" + (D.docs.length === 1 ? "" : "s") + " · " + total + " passages";
  status.append("Vault: ", b);
  if (searches.length) status.append("  ·  " + Math.max(done, 0) + "/" + searches.length +
    " searches · " + retrieved.size + (retrieved.size === 1 ? " passage" : " passages") + " retrieved" +
    (D.finished && t >= examEnd && cited.length ? " · " + cited.length + " quoted" : ""));
  let q = "";
  if (searches.length && t < searchEnd) {
    const s = searches[cur], k = Math.min(1, (t - cur * PER) / QUERY);
    q = "🔎 “" + s.query.slice(0, Math.ceil(s.query.length * k)) + (k < 1 ? "▍" : "”");
  } else if (!D.finished && D.running) q = "🔎 searching…";
  else if (searches.length && D.finished) q = cited.length ? "✓ Evidence quoted from the vault" : "✓ Search finished — no passage quoted";
  $("query").textContent = q;
  $("step").textContent = !searches.length ? "" : t >= end ? "done" :
    t < searchEnd ? "search " + (cur + 1) + " of " + searches.length : "evidence";
  // Side panel: the current search's hits, then the quoted evidence.
  const list = $("list");
  if (!searches.length && shownSearch !== -1) {
    shownSearch = -1; list.textContent = ""; $("ph").textContent = "In the vault";
    D.docs.forEach((d, k) => { const el = item("file", d.title, d.passages.length + " passages",
      d.file, d.color); el.style.animationDelay = Math.min(k, 8) * 40 + "ms"; list.appendChild(el); });
  } else if (searches.length && t < searchEnd && cur !== shownSearch && t >= cur * PER + QUERY) {
    shownSearch = cur; shownCite = -1; list.textContent = "";
    $("ph").textContent = "Search " + (cur + 1) + ": retrieved";
    searches[cur].hits.slice(0, 8).forEach((h, k) => { const s = byPid.get(h.passageId);
      const el = item("", where(s), h.score == null ? "" : h.score.toFixed(3), s.p.text, s.doc.color);
      el.style.animationDelay = (k * 50) + "ms"; list.appendChild(el); });
  } else if (D.finished && t >= examEnd && cited.length) {
    const upto = Math.min(cited.length - 1, Math.floor((t - examEnd) / CITE_STEP));
    if (shownSearch !== -3) { shownSearch = -3; list.textContent = "";
      $("ph").textContent = "Quoted as evidence"; }
    while (shownCite < upto) { shownCite++; const c = cited[shownCite], s = byPid.get(c.passageId);
      list.appendChild(item("cited", "✓ " + where(s), c.relationship, "“" + c.excerpt + "”")); }
  }
}

function frame(now) {
  // rAF's timestamp can be earlier than the performance.now() taken at start-up: never step back.
  const dt = Math.max(0, Math.min(100, now - last)); last = now;
  if (playing) t = Math.min(end, t + dt);
  draw(now); hud();
  requestAnimationFrame(frame);
}

$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸ Pause" : "▶ Play";
  if (playing && t >= end) t = 0; };
$("replay").onclick = () => { t = 0; playing = true; shownSearch = -2; shownCite = -1;
  $("play").textContent = "⏸ Pause"; };
if (!searches.length) $("controls").style.display = "none";

const tip = $("tip");
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 100;
  stars.forEach(s => { const d = (s.x - x) ** 2 + (s.y - y) ** 2; if (d < bd) { bd = d; best = s; } });
  if (!best) { tip.classList.remove("show"); return; }
  tip.textContent = ""; const src = document.createElement("div"); src.className = "src";
  src.textContent = where(best); tip.appendChild(src);
  tip.appendChild(document.createTextNode(best.p.text));
  tip.classList.add("show");
  tip.style.left = Math.min(x + 14, r.width - 290) + "px"; tip.style.top = Math.min(y + 14, r.height - 120) + "px";
});
cv.addEventListener("mouseleave", () => { tip.classList.remove("show"); });
new ResizeObserver(layout).observe(cv);
layout(); requestAnimationFrame(frame);
})();
</script></body></html>
