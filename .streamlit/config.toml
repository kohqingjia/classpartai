# Calm, high-contrast workspace. All fonts are local system fonts.
[theme]
base = "dark"
primaryColor = "#a5b4fc"
backgroundColor = "#0d1119"
secondaryBackgroundColor = "#151c28"
textColor = "#e9edf5"
borderColor = "#293140"
baseRadius = "0.65rem"
showSidebarBorder = true

[client]
toolbarMode = "minimal"
